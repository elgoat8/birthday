/* envelope + letter */
.env{position:absolute;left:50%;top:25%;width:58%;transform:translateX(-50%) rotate(1.2deg);z-index:2;box-shadow:0 6px 14px rgba(50,20,5,.4);display:block;pointer-events:none}
.letter{position:absolute;left:50%;top:9%;width:54%;transform:translateX(-50%) rotate(-2deg);z-index:1;cursor:pointer;
 box-shadow:0 3px 8px rgba(50,20,5,.35);transition:top .7s cubic-bezier(.5,0,.2,1),width .7s cubic-bezier(.5,0,.2,1),transform .7s cubic-bezier(.5,0,.2,1),box-shadow .7s}
.letter img{display:block;width:100%;pointer-events:none}
.letter.lift{top:5.5%;width:88%;transform:translateX(-50%) rotate(0deg);z-index:6;box-shadow:0 14px 34px rgba(40,15,0,.5)}
.letter:not(.lift):hover{top:8%}
.tape{position:absolute;width:26%;height:5.5%;background:rgba(240,190,200,.78);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:3;pointer-events:none}
.t1{left:5%;top:3%;transform:rotate(-32deg)} .t2{right:4%;bottom:4%;transform:rotate(-28deg);background:rgba(190,215,200,.8)}
.hint{position:absolute;left:0;right:0;bottom:2.5%;text-align:center;font-style:italic;font-size:calc(var(--pw)*.045);color:#7a4a3a;z-index:7;pointer-events:none;transition:opacity .4s}
/* flames */
.flame{position:absolute;transform-origin:50% 94%;pointer-events:none;will-change:transform;transition:opacity .22s}
.flame.out{opacity:0}
.smoke{position:absolute;width:5%;height:5%;border-radius:50%;background:radial-gradient(circle,rgba(110,95,85,.55),transparent 70%);opacity:0;pointer-events:none}
.smoke.go{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx,8px),-70px) scale(2.6)}}
.note{position:absolute;left:8%;right:8%;top:5%;padding:5% 5% 5%;text-align:center;background:#fff7e3;transform:rotate(-1.5deg) scale(.6);opacity:0;pointer-events:none;
 box-shadow:0 8px 20px rgba(60,30,10,.4);transition:opacity .5s,transform .6s cubic-bezier(.3,1.5,.5,1);z-index:8;font-size:calc(var(--pw)*.062)}
.note.show{opacity:1;transform:rotate(-1.5deg) scale(1);pointer-events:auto}
.note b{display:block;font-size:1.25em;color:#c2306a;font-style:italic;margin-bottom:.4em}
.note::before{content:"";position:absolute;left:38%;top:-9px;width:24%;height:18px;background:rgba(240,190,200,.85);transform:rotate(3deg)}
/* controls */
.controls{margin-top:14px;width:min(94vw,calc(var(--pw)*2));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;min-height:52px}
button{font:inherit;font-size:14px;color:#fff;background:#b3445f;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 #7d2a40;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,button.on{transform:translateY(2px);box-shadow:0 1px 0 #7d2a40}
button.alt{background:#8a6a4a;box-shadow:0 3px 0 #5e4630}
.note button{margin-top:.7em}
.meter{width:110px;height:12px;border-radius:8px;background:rgba(90,58,42,.25);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7bc47f,#f2c14e,#e0533d)}
.mlabel{font-size:12px;opacity:.85;max-width:260px;line-height:1.25}
.opencue{font-style:italic;opacity:.8;font-size:15px}
.hidden{display:none!important}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>

<canvas id="confetti"></canvas>
<script>
(function(){
"use strict";
var NAME="Aastha";            // <- change the name shown in "make a wish, ..."
var BLOW_SECONDS=0.5;      // continuous blowing needed to put flames out
var $=function(id){return document.getElementById(id)};
var root=document.documentElement,book=$("book"),leaf=$("leaf"),cover=$("cover");
var letter=$("letter"),hint=$("hint"),note=$("note"),relight=$("relight");
var micBtn=$("micBtn"),meterEl=$("meter"),meterWrap=$("meterWrap"),holdBtn=$("hold"),statusEl=$("status");
var backBtn=$("back"),opencue=$("opencue");
var isOpen=false;

/* ---------- sizing ---------- */
function fit(){
  var vw=window.innerWidth,vh=window.innerHeight,R=687/487;
  var top=Math.max(36,vh*0.06),ctl=70,pad=14;
  var phMax=vh-top-ctl-pad;
  var pw=Math.min(phMax/R,vw*0.47);
  pw=Math.max(pw,120);
  root.style.setProperty("--pw",pw+"px");
  root.style.setProperty("--ph",(pw*R)+"px");
}
window.addEventListener("resize",fit);fit();

/* ---------- open / close ---------- */
function openCard(){
  if(isOpen)return;isOpen=true;
  book.classList.add("open");leaf.classList.add("open");
  opencue.classList.add("hidden");
  [backBtn,micBtn,meterWrap,holdBtn,statusEl].forEach(function(e){e.classList.remove("hidden")});
  setStatus(micOK()?"tap “enable mic”, then blow on your mic":"mic needs https — use hold-to-blow (or spacebar)");
}
function closeCard(){
  if(!isOpen)return;isOpen=false;
  tuck();stopMic();
  book.classList.remove("open");leaf.classList.remove("open");
  [backBtn,micBtn,meterWrap,holdBtn,statusEl].forEach(function(e){e.classList.add("hidden")});
  opencue.classList.remove("hidden");
}
cover.addEventListener("click",openCard);
cover.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard()}});
backBtn.addEventListener("click",closeCard);

/* ---------- letter ---------- */
function tuck(){letter.classList.remove("lift");hint.textContent="tap the letter ✉️"}
function toggleLetter(){
  var up=letter.classList.toggle("lift");
  hint.textContent=up?"tap the letter to tuck it back":"tap the letter ✉️";
}
letter.addEventListener("click",toggleLetter);
letter.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();toggleLetter()}});

/* ---------- flames ---------- */
var flames=[0,1,2,3].map(function(i){return{el:$("f"+i),smoke:$("s"+i),phase:Math.random()*6,dir:1,out:false,cur:0,k:0.85+i*0.1}});
var blowT=0,lastBlowAt=0,allOut=false,level=0,lvlSmooth=0,holding=false,holdLvl=0,micLvl=0;
function placeSmoke(){
  flames.forEach(function(f){
    var s=f.el.style;
    f.smoke.style.left=(parseFloat(s.left)+parseFloat(s.width)/2-2.5)+"%";
    f.smoke.style.top=(parseFloat(s.top)+parseFloat(s.height)*0.7)+"%";
  });
}
placeSmoke();
function relightAll(){
  allOut=false;blowT=0;
  flames.forEach(function(f){f.out=false;f.el.classList.remove("out");f.smoke.classList.remove("go")});
  note.classList.remove("show");
}
relight.addEventListener("click",relightAll);
function blowOut(){
  flames.forEach(function(f,i){
    setTimeout(function(){f.out=true;f.el.classList.add("out");
      f.smoke.style.setProperty("--dx",(f.dir*14)+"px");
      void f.smoke.offsetWidth;f.smoke.classList.add("go");},i*70);
  });
  allOut=true;
  setTimeout(function(){
    $("wishText").textContent="make a wish, "+NAME+" ✨";
    note.classList.add("show");confettiBurst();
  },450);
}
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var t=now/1000;
  /* level: max of mic + hold-to-blow (ramped) */
  holdLvl+=((holding?0.75:0)-holdLvl)*Math.min(1,dt*12);
  var target=Math.max(micLvl,holdLvl);
  lvlSmooth+=(target-lvlSmooth)*Math.min(1,dt*(target>lvlSmooth?30:8));
  level=lvlSmooth;
  meterEl.style.width=Math.min(100,level*100)+"%";
  var TH=0.22;
  var blowing=isOpen&&!allOut&&level>TH;
  if(blowing){blowT+=dt;lastBlowAt=t}else if(t-lastBlowAt>0.18){blowT=Math.max(0,blowT-dt*2)}
  if(blowing&&blowT>=BLOW_SECONDS)blowOut();
  var prog=Math.min(1,blowT/BLOW_SECONDS);
  var bendTarget=blowing?(10+Math.min(1,level*1.4)*34):0;
  flames.forEach(function(f,i){
    if(f.out)return;
    f.cur+=(bendTarget-f.cur)*Math.min(1,dt*(blowing?14:6));
    var fl=Math.sin(t*9+f.phase)*0.04+Math.sin(t*15.3+f.phase*2)*0.025;
    var sway=Math.sin(t*3.1+f.phase)*1.6;
    var b=f.cur*f.k;
    var sy=1+fl-prog*0.35, sx=1-fl*0.6-prog*0.1;
    f.el.style.transform="rotate("+(sway+b)+"deg) skewX("+(-b*0.7)+"deg) scale("+sx+","+sy+")";
    f.el.style.opacity=(1-prog*0.35-(blowing?Math.random()*0.12:0));
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- hold-to-blow fallback ---------- */
function holdOn(){holding=true;holdBtn.classList.add("on")}
function holdOff(){holding=false;holdBtn.classList.remove("on")}
["pointerdown"].forEach(function(ev){holdBtn.addEventListener(ev,function(e){e.preventDefault();try{holdBtn.setPointerCapture(e.pointerId)}catch(_){}holdOn()})});
["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){holdBtn.addEventListener(ev,holdOff)});
holdBtn.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"&&isOpen){e.preventDefault();if(!e.repeat)holdOn()}
});
window.addEventListener("keyup",function(e){if(e.code==="Space")holdOff()});
window.addEventListener("blur",holdOff);

/* ---------- microphone (Web Audio) ---------- */
var ctx=null,stream=null,analyser=null,td=null,fd=null,micTimer=null,floor=0.01,calib=0;
function micOK(){return window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia}
function setStatus(s){statusEl.textContent=s}
function stopMic(){
  if(micTimer){clearInterval(micTimer);micTimer=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  if(ctx){try{ctx.close()}catch(_){}ctx=null}
  micLvl=0;micBtn.textContent="🎤 enable mic";
}
function startMic(){
  if(!micOK()){setStatus("mic blocked here (needs https) — hold the button or spacebar");return}
  if(stream){stopMic();setStatus("mic off");return}
  setStatus("asking for mic…");
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
  .then(function(s){
    stream=s;
    var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    if(ctx.resume)ctx.resume();
    var src=ctx.createMediaStreamSource(s);
    analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0.3;
    src.connect(analyser);
    td=new Float32Array(analyser.fftSize);fd=new Uint8Array(analyser.frequencyBinCount);
    floor=0.01;calib=0;
    micBtn.textContent="🎤 mic on";setStatus("listening… blow on the mic 💨");
    micTimer=setInterval(readMic,25);
  }).catch(function(){
    setStatus("mic blocked — hold the button or spacebar instead");
  });
}
function readMic(){
  if(!analyser)return;
  analyser.getFloatTimeDomainData(td);
  var sum=0;for(var i=0;i<td.length;i++)sum+=td[i]*td[i];
  var rms=Math.sqrt(sum/td.length);
  /* low-frequency share: blowing is wind-noise rumble (< ~1.2kHz), voices/claps are less so */
  analyser.getByteFrequencyData(fd);
  var binHz=ctx.sampleRate/analyser.fftSize,lowEnd=Math.max(2,Math.floor(1200/binHz)),lo=0,tot=0;
  for(var j=1;j<fd.length;j++){var v=fd[j]*fd[j];tot+=v;if(j<lowEnd)lo+=v}
  var lowShare=tot>0?lo/tot:0;
  if(calib<40){floor=Math.max(floor*0.9,rms);calib++}   /* first ~1s: learn room noise */
  else if(rms<floor*1.5)floor=floor*0.98+rms*0.02;
  var over=Math.max(0,rms-floor*1.6);
  var lv=Math.min(1,over*9);
  if(lowShare<0.45)lv*=0.35;      /* mostly high-pitched = probably not a blow */
  micLvl=lv;
}
micBtn.addEventListener("click",startMic);

/* ---------- confetti ---------- */
var cv=$("confetti"),cx=cv.getContext("2d"),parts=[],raf=0;
function sizeCv(){cv.width=window.innerWidth;cv.height=window.innerHeight}
window.addEventListener("resize",sizeCv);sizeCv();
function confettiBurst(){
  var cols=["#e8457c","#f6c244","#4aa3df","#7bc47f","#b07be0","#ff8a4c"];
  var rect=$("right").getBoundingClientRect();
  var ox=rect.left+rect.width/2,oy=rect.top+rect.height*0.25;
  for(var i=0;i<140;i++){
    var a=Math.random()*Math.PI*2,sp=3+Math.random()*9;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:140+Math.random()*80});
  }
  if(!raf)raf=requestAnimationFrame(tickC);
}
function tickC(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<cv.height+30});
  parts.forEach(function(p){
    p.vy+=0.28;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/40);
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  raf=parts.length?requestAnimationFrame(tickC):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
window.__card={openCard:openCard,closeCard:closeCard,state:function(){return{isOpen:isOpen,allOut:allOut,blowT:blowT}}};
})();
